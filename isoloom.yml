# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# GOAD-Light (Game of Active Directory, by Orange Cyberdefense) as an Isoloom spec: three Windows
# Server 2019 machines, two domains with a trust, provisioned by GOAD's own Ansible from a
# controller Isoloom adds. `isoloom generate`, then `cd .isoloom/vagrant && vagrant up`.
version: 1
name: goad-light

networks:
  lab: { cidr: 192.168.56.0/24 }

machines:
  dc01:   # kingslanding: sevenkingdoms.local
    networks: { lab: 10 }
    services: [{ port: 53, name: dns }, { port: 88, name: kerberos }, { port: 389, name: ldap }, { port: 445, name: smb }]
    resources: { cpus: 2, memory_mb: 3000 }
    vm:
      os: windows-server-2019
      provision: [vagrant/ConfigureRemotingForAnsible.ps1]

  dc02:   # winterfell: north.sevenkingdoms.local
    networks: { lab: 11 }
    services: [{ port: 53, name: dns }, { port: 88, name: kerberos }, { port: 389, name: ldap }, { port: 445, name: smb }]
    resources: { cpus: 2, memory_mb: 3000 }
    vm:
      os: windows-server-2019
      provision: [vagrant/ConfigureRemotingForAnsible.ps1]

  srv02:  # castelblack: IIS and MSSQL in the north
    networks: { lab: 22 }
    services: [{ port: 80, name: iis, http: true }, { port: 1433, name: mssql }, { port: 445, name: smb }]
    resources: { cpus: 2, memory_mb: 6000 }
    vm:
      os: windows-server-2019
      provision: [vagrant/ConfigureRemotingForAnsible.ps1]

provision:
  - ansible: ansible/main.yml
    inventory:
      - ad/GOAD-Light/data/inventory
      - ad/GOAD-Light/providers/isoloom/inventory
      - globalsettings.ini
    requirements: ansible/requirements_311.yml
